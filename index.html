<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="深圳市門診特定病種（普通門診統籌、「雙通道」）定點藥店與重點醫院周邊藥房檢索及地圖導航平台">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23059669'/%3E%3Cpath d='M50 22v56M22 50h56' stroke='white' stroke-width='14' stroke-linecap='round'/%3E%3C/svg%3E">
    <title>深圳市定點藥店及醫院周邊藥房導航系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <!-- PapaParse for CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Leaflet: keep panes/controls scoped below sticky header & toast */
        .leaflet-container { font: inherit; z-index: 0; background: #e8eef2; }
        .leaflet-div-icon { background: transparent; border: none; }

        /* Numbered pharmacy markers */
        .mk {
            width: 26px; height: 26px; border-radius: 9999px;
            background: #059669; color: #fff; border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,.35);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; line-height: 1;
        }
        .mk-near { background: #4f46e5; }
        .mk-hosp {
            width: 32px; height: 32px; border-radius: 9999px;
            background: #e11d48; color: #fff; border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.4);
            display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .mk-user-wrap { position: relative; width: 18px; height: 18px; }
        .mk-user {
            position: absolute; inset: 0; border-radius: 9999px;
            background: #2563eb; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4);
        }
        .mk-user-pulse {
            position: absolute; inset: -8px; border-radius: 9999px;
            background: rgba(37,99,235,.25); animation: userPulse 1.8s ease-out infinite;
        }
        @keyframes userPulse {
            0% { transform: scale(.5); opacity: 1; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        /* Card flash highlight when jumping from a map marker */
        .flash-card { animation: flashRing 1.6s ease-out; }
        @keyframes flashRing {
            0%, 60% { box-shadow: 0 0 0 3px rgba(16,185,129,.75); border-color: #10b981; }
            100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
        }

        /* Slim horizontal scrollbars for chip rows */
        .chip-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .chip-scroll::-webkit-scrollbar { height: 6px; }
        .chip-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

        .no-scrollbar { scrollbar-width: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* 行動裝置上預設只顯示前 4 個醫院磁貼，展開後顯示全部 */
        @media (max-width: 767px) {
            #hospitalChips.limit-mobile > :nth-child(n+5) { display: none; }
        }

        @media print {
            header, #searchbar, #filterBar, #hospitalSection, #mapPanel, #mapToggleBtn, #toast, footer { display: none !important; }
            #tableContainer { display: block !important; border: none; }
            #cardContainer { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 置頂區：標題列 + 搜尋工具列 -->
    <div id="stickyHead" class="sticky top-0 z-30 shadow-md">
        <header class="bg-gradient-to-r from-teal-800 via-emerald-700 to-teal-900 text-white">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-3">
                <div class="flex items-center space-x-3 min-w-0">
                    <div class="p-2 bg-white/10 rounded-xl backdrop-blur-md border border-white/20 shrink-0">
                        <i class="fa-solid fa-hospital-user text-xl text-emerald-200"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-base md:text-lg font-bold tracking-tight truncate">深圳市定點藥店 & 醫院周邊藥房導航</h1>
                        <p class="hidden sm:block text-[11px] text-emerald-100/90">門診特定病種（普通門診統籌、「雙通道」）定點藥店服務平台</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2 shrink-0">
                    <label for="csvFileInput" title="匯入藥店 CSV 資料"
                           class="cursor-pointer bg-white/15 hover:bg-white/25 border border-white/20 text-white text-xs px-3 py-2 rounded-lg transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-file-import"></i>
                        <span class="hidden sm:inline">匯入 CSV</span>
                    </label>
                    <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                    <button id="exportCsvBtn" title="導出目前篩選結果"
                            class="bg-white/15 hover:bg-white/25 border border-white/20 text-white text-xs px-3 py-2 rounded-lg transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-file-export"></i>
                        <span class="hidden sm:inline">導出結果</span>
                    </button>
                    <button id="resetFiltersBtn" title="重設所有檢索條件"
                            class="bg-emerald-950/40 hover:bg-emerald-950/60 text-white text-xs px-3 py-2 rounded-lg transition flex items-center space-x-1.5 border border-emerald-400/30">
                        <i class="fa-solid fa-rotate-left"></i>
                        <span class="hidden sm:inline">重設</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 全域搜尋列（任何時候皆可搜尋） -->
        <div id="searchbar" class="bg-white/95 backdrop-blur border-b border-slate-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex items-center gap-2">
                <div class="relative flex-grow">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <input type="text" id="searchInput" autocomplete="off"
                           placeholder="搜尋藥店名稱、地址、機構編碼、轄區或醫院…（支援簡/繁體、空格多關鍵字，按 / 快速聚焦）"
                           class="w-full pl-10 pr-9 py-2.5 bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition text-sm">
                    <button id="clearSearchBtn" title="清除搜尋"
                            class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>
                <button id="getGpsBtn" title="使用我的 GPS 位置尋找最近藥店"
                        class="shrink-0 px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-semibold shadow-sm transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-location-crosshairs"></i>
                    <span class="hidden md:inline">附近藥店</span>
                </button>
                <div class="shrink-0 flex items-center space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                    <button id="cardViewBtn" title="卡片圖文檢視" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-800 bg-white shadow-sm transition flex items-center space-x-1">
                        <i class="fa-solid fa-border-all"></i><span class="hidden md:inline">卡片</span>
                    </button>
                    <button id="tableViewBtn" title="表格列印檢視" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition flex items-center space-x-1">
                        <i class="fa-solid fa-list"></i><span class="hidden md:inline">表格</span>
                    </button>
                </div>
                <button id="mapToggleBtn" title="顯示 / 隱藏地圖"
                        class="lg:hidden shrink-0 px-3.5 py-2.5 bg-teal-700 hover:bg-teal-800 text-white rounded-xl text-sm font-semibold shadow-sm transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span class="hidden sm:inline">地圖</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4 space-y-4">

        <!-- 醫院快速尋找（核心功能，置頂突出顯示） -->
        <section id="hospitalSection" class="rounded-2xl shadow-sm border border-emerald-200/90 bg-gradient-to-br from-emerald-50/90 via-white to-teal-50/80 overflow-hidden">
            <button id="hospitalToggle" class="w-full px-4 md:px-5 py-3.5 flex items-center justify-between gap-3 hover:bg-emerald-100/40 transition">
                <span class="flex items-center gap-3 min-w-0">
                    <span class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-md shrink-0 text-lg">
                        <i class="fa-solid fa-hospital"></i>
                    </span>
                    <span class="text-left min-w-0">
                        <span class="flex items-center gap-2">
                            <span class="text-base md:text-lg font-bold text-emerald-950 truncate">按附近醫院快速尋找</span>
                            <span class="bg-emerald-600 text-white text-[10px] px-2 py-0.5 rounded-full font-bold shrink-0 shadow-sm">推薦</span>
                        </span>
                        <span id="hospitalSectionHint" class="block text-[11px] md:text-xs text-emerald-700/90 truncate">點選醫院，即按步行距離列出周邊定點藥店並顯示地圖</span>
                    </span>
                </span>
                <i id="hospitalToggleIcon" class="fa-solid fa-chevron-up text-emerald-600/70 transition-transform duration-200 shrink-0"></i>
            </button>
            <div id="hospitalChipsWrap" class="px-4 md:px-5 pb-4 md:pb-5">
                <div id="hospitalChips" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5 limit-mobile"></div>
                <button id="showAllHospitalsBtn" class="md:hidden mt-2.5 w-full py-2.5 text-xs font-bold text-emerald-700 bg-emerald-100/80 hover:bg-emerald-100 border border-emerald-200 rounded-xl transition">
                    <i class="fa-solid fa-angles-down mr-1"></i>顯示全部 12 間醫院
                </button>
            </div>
        </section>

        <!-- 篩選狀態列：轄區快選 + 目前參考點 + 結果數 -->
        <section id="filterBar" class="space-y-2.5">
            <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
                <span class="text-xs text-slate-500">
                    找到 <strong id="resultCount" class="text-emerald-700 font-bold text-base">0</strong> 家定點藥店
                </span>
                <span id="sortHint" class="text-[11px] text-slate-400"></span>
                <button id="activeRefChip" class="hidden items-center space-x-1.5 bg-emerald-100 hover:bg-emerald-200/70 text-emerald-900 border border-emerald-300 text-xs pl-2.5 pr-2 py-1 rounded-full font-medium transition">
                    <i class="fa-solid fa-location-dot text-emerald-600"></i>
                    <span id="activeRefText"></span>
                    <i class="fa-solid fa-xmark text-emerald-500 hover:text-emerald-800 pl-1" title="取消參考點"></i>
                </button>
            </div>
            <div id="districtTags" class="flex gap-1.5 overflow-x-auto chip-scroll pb-1"></div>
        </section>

        <!-- 結果 + 地圖 雙欄 -->
        <div class="lg:grid lg:grid-cols-5 lg:gap-5 lg:items-start">

            <!-- 地圖欄（行動裝置預設隱藏，可用工具列按鈕開啟；桌面版常駐） -->
            <div class="lg:col-span-2 lg:order-2 mb-4 lg:mb-0">
                <div id="mapPanel" class="hidden lg:block lg:sticky bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="px-4 py-2.5 flex items-center justify-between border-b border-slate-100">
                        <h3 class="text-sm font-bold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-map-location-dot text-emerald-600"></i>位置總覽
                        </h3>
                        <span id="mapAttributionNote" class="text-[10px] text-slate-400"></span>
                    </div>
                    <div id="overviewMap" class="w-full h-[300px] lg:h-[460px]"></div>
                    <div class="px-4 py-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] text-slate-500 border-t border-slate-100">
                        <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-600"></span>定點藥店</span>
                        <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full bg-indigo-600"></span>院邊藥房</span>
                        <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-600"></span>醫院</span>
                        <span class="flex items-center gap-1"><span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-600"></span>我的位置</span>
                        <span class="ml-auto text-slate-400">點擊標記可跳轉至對應卡片</span>
                    </div>
                </div>
            </div>

            <!-- 結果欄 -->
            <div class="lg:col-span-3 lg:order-1 space-y-4">

                <!-- 卡片檢視列表 -->
                <section id="cardContainer" class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                    <!-- 藥店卡片動態渲染 -->
                </section>

                <!-- 表格檢視列表 -->
                <section id="tableContainer" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 border-b border-slate-200 font-semibold text-xs">
                                    <th class="py-3 px-3 w-12 text-center">序號</th>
                                    <th class="py-3 px-3 w-20">轄區</th>
                                    <th class="py-3 px-3">機構名稱</th>
                                    <th class="py-3 px-3">詳細地址</th>
                                    <th class="py-3 px-3 w-24 text-center">距離</th>
                                    <th class="py-3 px-3 w-24 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-100">
                                <!-- 表格列動態渲染 -->
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 無結果提示 -->
                <div id="noResults" class="hidden bg-white rounded-2xl p-12 text-center border border-slate-200 shadow-sm space-y-3">
                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl">
                        <i class="fa-solid fa-store-slash"></i>
                    </div>
                    <h3 class="text-base font-bold text-slate-700">未找到符合條件的藥店</h3>
                    <p id="noResultsHint" class="text-slate-500 text-xs max-w-md mx-auto">請嘗試其他關鍵字、切換轄區或清除篩選條件。</p>
                    <button id="clearAllFiltersBtn" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-medium transition">
                        重設所有條件
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-10 text-center text-xs text-slate-500 space-y-1">
        <p>深圳市門診特定病種定點零售藥店與醫院周邊資料庫 · 截至 2026年3月31日</p>
        <p class="text-[10px] text-slate-400">地圖僅供位置參考，實際路線請以導航 App 為準</p>
    </footer>

    <!-- 單店地圖 Modal -->
    <div id="mapModal" class="hidden fixed inset-0 z-40 items-center justify-center p-4">
        <div id="mapModalBackdrop" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="px-4 py-3 flex items-start justify-between gap-3 border-b border-slate-100">
                <div class="min-w-0">
                    <h3 id="mapModalTitle" class="text-sm font-bold text-slate-800 truncate"></h3>
                    <p id="mapModalMeta" class="text-[11px] text-slate-500 truncate"></p>
                </div>
                <button id="mapModalClose" class="p-1.5 text-slate-400 hover:text-slate-700 transition shrink-0" title="關閉">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="modalMap" class="w-full h-[46vh] min-h-[280px]"></div>
            <div class="px-4 py-3 border-t border-slate-100 flex items-center gap-2 text-xs">
                <span id="mapModalDist" class="text-amber-700 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200/60 font-semibold hidden"></span>
                <span class="flex-grow"></span>
                <button id="mapModalCopy" class="py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition font-medium flex items-center space-x-1.5">
                    <i class="fa-regular fa-copy"></i><span>複製地址</span>
                </button>
                <a id="mapModalNav" href="#" target="_blank" rel="noopener noreferrer"
                   class="py-2 px-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition font-medium flex items-center space-x-1.5">
                    <i class="fa-solid fa-route"></i><span>步行導航</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Toast 訊息通知 -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-3 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastMsg" class="text-xs font-medium">訊息通知</span>
    </div>

    <!-- JavaScript 核心 logic -->
    <script>
        /* ============================= 資料 ============================= */

        // 深圳市重點醫院清單與經緯度座標 (WGS-84)
        const keyHospitals = [
            { id: 'h1', name: '北京大學深圳醫院', district: '福田區', lat: 22.5562, lng: 114.0538, desc: '蓮花路1120號 (蓮花北)' },
            { id: 'h2', name: '深圳市人民醫院 (留醫部)', district: '羅湖區', lat: 22.5574, lng: 114.1293, desc: '翠竹路1017號' },
            { id: 'h3', name: '深圳市第二人民醫院', district: '福田區', lat: 22.5578, lng: 114.0882, desc: '筍崗西路3002號' },
            { id: 'h4', name: '深圳市中醫院', district: '福田區', lat: 22.5367, lng: 114.0841, desc: '福華路1号' },
            { id: 'h5', name: '香港大學深圳醫院', district: '南山區', lat: 22.5284, lng: 113.9912, desc: '海園一路1號' },
            { id: 'h6', name: '深圳市兒童醫院', district: '福田區', lat: 22.5480, lng: 114.0560, desc: '益田路7019號' },
            { id: 'h7', name: '腫瘤醫院深圳醫院', district: '龍崗區', lat: 22.6885, lng: 114.2690, desc: '寶荷路113號' },
            { id: 'h8', name: '深圳市第三人民醫院', district: '龍崗區', lat: 22.6362, lng: 114.1248, desc: '布欄路29號' },
            { id: 'h9', name: '深圳大學總醫院', district: '南山區', lat: 22.5938, lng: 113.9715, desc: '學苑大道1098號' },
            { id: 'h10', name: '寶安區人民醫院', district: '寶安區', lat: 22.5594, lng: 113.8967, desc: '龍井二路118號' },
            { id: 'h11', name: '龍崗區中心醫院', district: '龍崗區', lat: 22.7230, lng: 114.2570, desc: '龍崗大道6082號' },
            { id: 'h12', name: '中山大學附屬第七醫院', district: '光明區', lat: 22.7820, lng: 113.9120, desc: '圳園路628號' }
        ];

        // 高德圖資使用 GCJ-02 座標系；瀏覽器 GPS 與本資料為 WGS-84，疊圖前需轉換
        const PI_X = 3.1415926535897932384626;
        const AXIS = 6378245.0;
        const OFFSET = 0.00669342162296594323;

        function outOfChina(lat, lng) {
            return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
        }
        function transformLat(x, y) {
            let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * PI_X) + 20.0 * Math.sin(2.0 * x * PI_X)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(y * PI_X) + 40.0 * Math.sin(y / 3.0 * PI_X)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(y / 12.0 * PI_X) + 320 * Math.sin(y * PI_X / 30.0)) * 2.0 / 3.0;
            return ret;
        }
        function transformLng(x, y) {
            let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * PI_X) + 20.0 * Math.sin(2.0 * x * PI_X)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(x * PI_X) + 40.0 * Math.sin(x / 3.0 * PI_X)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(x / 12.0 * PI_X) + 300.0 * Math.sin(x / 30.0 * PI_X)) * 2.0 / 3.0;
            return ret;
        }
        function wgs84ToGcj02(lat, lng) {
            if (outOfChina(lat, lng)) return { lat, lng };
            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * PI_X;
            let magic = Math.sin(radLat);
            magic = 1 - OFFSET * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((AXIS * (1 - OFFSET)) / (magic * sqrtMagic) * PI_X);
            dLng = (dLng * 180.0) / (AXIS / sqrtMagic * Math.cos(radLat) * PI_X);
            return { lat: lat + dLat, lng: lng + dLng };

            },

            invalidate() {
                if (this.map) setTimeout(() => this.map.invalidateSize(), 60);
            }
        };

        /* ============================= 卡片內迷你地圖 ============================= */
        const miniMaps = new Map();   // id -> L.Map
        const openMiniMapIds = new Set();

        function teardownMiniMaps() {
            miniMaps.forEach(m => { try { m.remove(); } catch (e) {} });
            miniMaps.clear();
        }

        function buildMiniMap(item, refPoint) {
            if (!window.L || !tileMode) return;
            const el = document.getElementById('minimap-' + String(item.id));
            if (!el || miniMaps.has(String(item.id))) return;
            const map = L.map(el, { scrollWheelZoom: false, zoomControl: true, attributionControl: false });
            createTileLayer().addTo(map);
            const p = project(item.lat, item.lng);
            const pts = [[p.lat, p.lng]];
            L.marker([p.lat, p.lng], { icon: OverviewMap.pharmacyIcon('·', !!item.isNearHospital) })
                .addTo(map).bindPopup(`<div style="font-weight:700;font-size:12px;">${escapeHtml(item.name)}</div>`);
            if (refPoint) {
                const rp = project(refPoint.lat, refPoint.lng);
                const icon = refPoint.type === 'gps' ? OverviewMap.userIcon() : OverviewMap.hospitalIcon();
                L.marker([rp.lat, rp.lng], { icon }).addTo(map)
                    .bindPopup(`<div style="font-weight:700;font-size:12px;">${escapeHtml(refPoint.name)}</div>`);
                L.polyline([[rp.lat, rp.lng], [p.lat, p.lng]], { color: '#059669', weight: 3, dashArray: '6 6', opacity: 0.8 }).addTo(map);
                pts.push([rp.lat, rp.lng]);
                map.fitBounds(pts, { padding: [28, 28], maxZoom: 16 });
            } else {
                map.setView([p.lat, p.lng], 16);
            }
            miniMaps.set(String(item.id), map);
            setTimeout(() => map.invalidateSize(), 80);
        }

        /* ============================= 單店地圖 Modal ============================= */
        const ModalMap = {
            map: null,
            layerGroup: null,
            currentItem: null,

            init() {
                if (this.map || !window.L || !tileMode) return;
                this.map = L.map('modalMap', { scrollWheelZoom: true });
                createTileLayer().addTo(this.map);
                this.layerGroup = L.layerGroup().addTo(this.map);
            },

            open(item) {
                this.currentItem = item;
                mapModalTitle.textContent = item.name || '未知藥店';
                mapModalMeta.textContent = `${districtLabel(item.district)} · ${item.address || ''}`;
                if (item.distanceKm !== undefined) {
                    mapModalDist.classList.remove('hidden');
                    mapModalDist.textContent = `距 ${item.originName || '參考點'} 約 ${formatDistance(item.distanceKm)}`;
                } else {
                    mapModalDist.classList.add('hidden');
                }
                mapModalNav.href = amapNavUrl(item);

                mapModal.classList.remove('hidden');
                mapModal.classList.add('flex');
                document.body.style.overflow = 'hidden';

                this.init();
                if (this.map) {
                    this.layerGroup.clearLayers();
                    const p = project(item.lat, item.lng);
                    L.marker([p.lat, p.lng], { icon: OverviewMap.pharmacyIcon('·', !!item.isNearHospital) }).addTo(this.layerGroup);
                    const pts = [[p.lat, p.lng]];
                    const refPoint = getReferencePoint();
                    if (refPoint) {
                        const rp = project(refPoint.lat, refPoint.lng);
                        const icon = refPoint.type === 'gps' ? OverviewMap.userIcon() : OverviewMap.hospitalIcon();
                        L.marker([rp.lat, rp.lng], { icon }).addTo(this.layerGroup);
                        L.polyline([[rp.lat, rp.lng], [p.lat, p.lng]], { color: '#059669', weight: 3, dashArray: '6 6', opacity: 0.8 }).addTo(this.layerGroup);
                        pts.push([rp.lat, rp.lng]);
                    }
                    setTimeout(() => {
                        this.map.invalidateSize();
                        if (pts.length > 1) this.map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
                        else this.map.setView(pts[0], 16);
                    }, 80);
                }
            },

            close() {
                mapModal.classList.add('hidden');
                mapModal.classList.remove('flex');
                document.body.style.overflow = '';
            }
        };

        /* ============================= 初始化 ============================= */
        document.addEventListener('DOMContentLoaded', () => {
            renderDistrictTags();
            renderHospitalChips();
            setupEventListeners();
            setStickyVar();
            window.addEventListener('resize', setStickyVar);
            update();

            if (!window.L) {
                // 地圖函式庫載入失敗時優雅降級
                $('overviewMap').innerHTML = '<div class="h-full flex items-center justify-center text-xs text-slate-400 p-6 text-center">地圖元件載入失敗，請檢查網路後重新整理</div>';
                mapToggleBtn.classList.add('hidden');
            } else {
                detectTileProvider(() => {
                    OverviewMap.init();
                    ModalMap.init && null; // modal 地圖採惰性初始化
                    OverviewMap.update(currentFilteredData, getReferencePoint());
                    OverviewMap.invalidate();
                });
            }
        });

        // 依置頂區高度設定地圖 sticky 偏移
        function setStickyVar() {
            const h = stickyHead.offsetHeight || 0;
            mapPanel.style.top = (h + 12) + 'px';
        }

        /* ============================= 事件綁定 ============================= */
        function setupEventListeners() {
            let searchTimer = null;
            searchInput.addEventListener('input', () => {
                toggleClearSearchBtn();
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    searchQuery = searchInput.value.trim();
                    update();
                }, 150);
            });
            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                toggleClearSearchBtn();
                update();
                searchInput.focus();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement !== searchInput) {
                    e.preventDefault();
                    searchInput.focus();
                } else if (e.key === 'Escape') {
                    if (!mapModal.classList.contains('hidden')) { ModalMap.close(); return; }
                    if (document.activeElement === searchInput && searchInput.value) {
                        searchInput.value = '';
                        searchQuery = '';
                        toggleClearSearchBtn();
                        update();
                    }
                }
            });

            districtTags.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-district]');
                if (!btn) return;
                selectedDistrict = btn.getAttribute('data-district');
                renderDistrictTags();
                update();
            });

            hospitalChips.addEventListener('click', (e) => {
                const btn = e.target.closest('[data-hospital]');
                if (!btn) return;
                const hid = btn.getAttribute('data-hospital');
                if (hid === '') {
                    reference = null;
                } else {
                    const hosp = keyHospitals.find(h => h.id === hid);
                    if (hosp) reference = { type: 'hospital', hospital: hosp };
                }
                renderHospitalChips();
                update();
            });

            hospitalToggle.addEventListener('click', () => {
                hospitalSectionOpen = !hospitalSectionOpen;
                hospitalChipsWrap.classList.toggle('hidden', !hospitalSectionOpen);
                hospitalToggleIcon.classList.toggle('rotate-180', !hospitalSectionOpen);
            });

            showAllHospitalsBtn.addEventListener('click', () => {
                hospitalChips.classList.remove('limit-mobile');
                showAllHospitalsBtn.classList.add('hidden');
            });

            activeRefChip.addEventListener('click', () => {
                reference = null;
                renderHospitalChips();
                update();
            });

            cardViewBtn.addEventListener('click', () => setViewMode('card'));
            tableViewBtn.addEventListener('click', () => setViewMode('table'));
            getGpsBtn.addEventListener('click', handleGpsLocation);

            mapToggleBtn.addEventListener('click', () => {
                mobileMapOpen = !mobileMapOpen;
                mapPanel.classList.toggle('hidden', !mobileMapOpen);
                if (mobileMapOpen) OverviewMap.invalidate();
            });

            resetFiltersBtn.addEventListener('click', resetAll);
            clearAllFiltersBtn.addEventListener('click', resetAll);
            csvFileInput.addEventListener('change', handleCsvUpload);
            exportCsvBtn.addEventListener('click', exportFilteredCsv);

            // Modal 事件
            mapModalClose.addEventListener('click', () => ModalMap.close());
            mapModalBackdrop.addEventListener('click', () => ModalMap.close());
            mapModalCopy.addEventListener('click', () => {
                if (ModalMap.currentItem) copyToClipboard(ModalMap.currentItem.address);
            });

            // 全域委派：卡片/表格/彈窗內的操作按鈕
            document.addEventListener('click', (e) => {
                const el = e.target.closest('[data-action]');
                if (!el) return;
                const id = el.getAttribute('data-id');
                const action = el.getAttribute('data-action');
                const item = currentFilteredData.find(p => String(p.id) === String(id));
                if (action === 'copy' && item) {
                    copyToClipboard(item.address);
                } else if (action === 'minimap' && item) {
                    toggleMiniMap(item);
                } else if (action === 'modalmap' && item) {
                    ModalMap.open(item);
                } else if (action === 'scrollcard' && item) {
                    jumpToCard(item.id);
                } else if (action === 'focusmarker' && item) {
                    ensureMapVisible();
                    OverviewMap.focus(item.id);
                }
            });

            // 卡片點擊（非按鈕區域）→ 地圖聚焦
            cardContainer.addEventListener('click', (e) => {
                if (e.target.closest('button, a')) return;
                const card = e.target.closest('[data-card-id]');
                if (!card) return;
                ensureMapVisible();
                OverviewMap.focus(card.getAttribute('data-card-id'));
            });
        }

        function ensureMapVisible() {
            if (window.innerWidth < 1024 && !mobileMapOpen) {
                mobileMapOpen = true;
                mapPanel.classList.remove('hidden');
                OverviewMap.invalidate();
            }
            if (window.innerWidth < 1024) {
                mapPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function jumpToCard(id) {
            if (viewMode !== 'card') {
                const item = currentFilteredData.find(p => String(p.id) === String(id));
                if (item) ModalMap.open(item);
                return;
            }
            const card = document.querySelector(`[data-card-id="${CSS.escape(String(id))}"]`);
            if (!card) return;
            card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            card.classList.remove('flash-card');
            void card.offsetWidth; // 重新觸發動畫
            card.classList.add('flash-card');
        }

        function toggleMiniMap(item) {
            const id = String(item.id);
            if (openMiniMapIds.has(id)) {
                openMiniMapIds.delete(id);
                const m = miniMaps.get(id);
                if (m) { try { m.remove(); } catch (e) {} miniMaps.delete(id); }
                renderCards(currentFilteredData);
            } else {
                openMiniMapIds.add(id);
                renderCards(currentFilteredData);
            }
        }

        function toggleClearSearchBtn() {
            clearSearchBtn.classList.toggle('hidden', searchInput.value.trim().length === 0);
        }

        /* ============================= 檢視切換 ============================= */
        function setViewMode(mode) {
            viewMode = mode;
            const activeCls = 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-800 bg-white shadow-sm transition flex items-center space-x-1';
            const idleCls = 'px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition flex items-center space-x-1';
            cardViewBtn.className = mode === 'card' ? activeCls : idleCls;
            tableViewBtn.className = mode === 'table' ? activeCls : idleCls;
            applyViewVisibility();
        }

        function applyViewVisibility() {
            const hasData = currentFilteredData.length > 0;
            noResults.classList.toggle('hidden', hasData);
            cardContainer.classList.toggle('hidden', !hasData || viewMode !== 'card');
            tableContainer.classList.toggle('hidden', !hasData || viewMode !== 'table');
        }

        /* ============================= 參考點 ============================= */
        function getReferencePoint() {
            if (!reference) return null;
            if (reference.type === 'hospital') {
                const h = reference.hospital;
                return { type: 'hospital', lat: h.lat, lng: h.lng, name: h.name };
            }
            if (reference.type === 'gps') {
                return { type: 'gps', lat: reference.lat, lng: reference.lng, name: '我的位置' };
            }
            return null;
        }

        /* ============================= 核心篩選與排序 ============================= */
        function computeResults() {
            let data = rawPharmacies.map(p => ({ ...p }));

            if (selectedDistrict) {
                data = data.filter(p => p.district === selectedDistrict);
            }

            const terms = queryTerms(searchQuery);
            if (terms.length > 0) {
                data = data.filter(item => {
                    const hay = normalizeText([
                        item.name, item.address, item.code,
                        item.district, districtLabel(item.district), item.hospitalRef
                    ].filter(Boolean).join(' '));
                    return terms.every(t => hay.includes(t));
                });
            }

            const refPoint = getReferencePoint();
            if (refPoint) {
                data.forEach(p => {
                    p.distanceKm = calculateDistanceKm(refPoint.lat, refPoint.lng, p.lat, p.lng);
                    p.originName = refPoint.name;
                });
                data.sort((a, b) => a.distanceKm - b.distanceKm);
            } else {
                data.sort((a, b) =>
                    String(a.district || '').localeCompare(String(b.district || ''), 'zh-Hant') ||
                    String(a.name || '').localeCompare(String(b.name || ''), 'zh-Hant'));
            }
            return { data, refPoint };
        }

        function update() {
            const { data, refPoint } = computeResults();
            currentFilteredData = data;

            resultCount.textContent = data.length;

            // 參考點 chip
            if (refPoint) {
                activeRefChip.classList.remove('hidden');
                activeRefChip.classList.add('flex');
                activeRefText.textContent = refPoint.type === 'gps' ? '我的位置' : refPoint.name;
                sortHint.textContent = `已按與「${refPoint.name}」的距離排序`;
            } else {
                activeRefChip.classList.add('hidden');
                activeRefChip.classList.remove('flex');
                sortHint.textContent = '按轄區與名稱排序；點選醫院或「附近藥店」可依距離排序';
            }
            hospitalSectionHint.textContent = refPoint && refPoint.type === 'hospital'
                ? `目前選擇：${refPoint.name} · 已按步行距離排序周邊藥店`
                : '點選醫院，即按步行距離列出周邊定點藥店並顯示地圖';

            // 無結果提示語
            if (data.length === 0) {
                if (searchQuery) {
                    noResultsHint.textContent = `找不到與「${searchQuery}」相符的藥店，請嘗試其他關鍵字（支援簡/繁體輸入）。`;
                } else if (selectedDistrict) {
                    noResultsHint.textContent = `「${districtLabel(selectedDistrict)}」目前沒有資料，請切換其他轄區。`;
                } else {
                    noResultsHint.textContent = '請嘗試其他關鍵字、切換轄區或清除篩選條件。';
                }
            }

            applyViewVisibility();
            renderCards(data);
            renderTable(data);
            OverviewMap.update(data, refPoint);
        }

        /* ============================= 渲染：轄區快選 ============================= */
        function districtLabel(d) {
            return districtDisplay[d] || d || '其他';
        }

        function renderDistrictTags() {
            const districts = Array.from(new Set(rawPharmacies.map(p => p.district).filter(Boolean)))
                .sort((a, b) => districtLabel(a).localeCompare(districtLabel(b), 'zh-Hant'));
            districtTags.innerHTML = '';

            const mkBtn = (value, label) => {
                const active = selectedDistrict === value;
                const btn = document.createElement('button');
                btn.setAttribute('data-district', value);
                btn.className = 'shrink-0 px-3 py-1.5 text-xs rounded-full border transition font-medium ' + (active
                    ? 'border-emerald-600 bg-emerald-600 text-white shadow-sm'
                    : 'border-slate-200 bg-white hover:border-emerald-400 hover:text-emerald-700 text-slate-600');
                btn.textContent = label;
                return btn;
            };

            districtTags.appendChild(mkBtn('', '全部轄區'));
            districts.forEach(d => districtTags.appendChild(mkBtn(d, districtLabel(d))));
        }

        /* ============================= 渲染：醫院快選 ============================= */
        function renderHospitalChips() {
            hospitalChips.innerHTML = '';
            const activeHospId = reference && reference.type === 'hospital' ? reference.hospital.id : null;

            const baseCls = 'p-2.5 md:p-3 rounded-xl border text-left transition flex flex-col justify-between gap-0.5 min-h-[76px]';
            const idleCls = 'border-emerald-100/90 bg-white/80 hover:border-emerald-400 hover:bg-emerald-50 text-slate-700 shadow-sm';
            const activeCls = 'border-emerald-600 bg-emerald-600 text-white shadow-md';

            // 「全部藥店」磁貼
            const allSelected = !reference;
            const allBtn = document.createElement('button');
            allBtn.setAttribute('data-hospital', '');
            allBtn.className = baseCls + ' ' + (allSelected ? activeCls : idleCls);
            allBtn.innerHTML = `
                <div class="flex items-center justify-between gap-1">
                    <span class="text-[10px] font-bold ${allSelected ? 'text-emerald-100' : 'text-emerald-700'}">快速瀏覽</span>
                    ${allSelected ? '<i class="fa-solid fa-circle-check text-white text-xs"></i>' : ''}
                </div>
                <div class="text-xs md:text-sm font-bold leading-tight flex items-center gap-1">
                    <i class="fa-solid fa-list-ul ${allSelected ? 'text-emerald-100' : 'text-emerald-600'}"></i>全部藥店
                </div>
                <div class="text-[10px] ${allSelected ? 'text-emerald-100/90' : 'text-slate-400'} line-clamp-1">不限醫院距離</div>`;
            hospitalChips.appendChild(allBtn);

            keyHospitals.forEach(hosp => {
                const isSelected = activeHospId === hosp.id;
                const btn = document.createElement('button');
                btn.setAttribute('data-hospital', hosp.id);
                btn.className = baseCls + ' ' + (isSelected ? activeCls : idleCls);
                btn.innerHTML = `
                    <div class="flex items-center justify-between gap-1">
                        <span class="text-[10px] font-bold ${isSelected ? 'text-emerald-100' : 'text-emerald-700'}">${escapeHtml(hosp.district)}</span>
                        ${isSelected ? '<i class="fa-solid fa-circle-check text-white text-xs"></i>' : ''}
                    </div>
                    <div class="text-xs md:text-sm font-bold leading-tight line-clamp-2">${escapeHtml(hosp.name)}</div>
                    <div class="text-[10px] ${isSelected ? 'text-emerald-100/90' : 'text-slate-400'} line-clamp-1">${escapeHtml(hosp.desc)}</div>`;
                hospitalChips.appendChild(btn);
            });
        }

        /* ============================= 渲染：卡片 ============================= */
        function renderCards(data) {
            teardownMiniMaps();
            cardContainer.innerHTML = '';
            const refPoint = getReferencePoint();

            data.forEach((item, idx) => {
                const card = document.createElement('div');
                card.setAttribute('data-card-id', item.id);
                card.className = 'bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm hover:shadow-md hover:border-emerald-300 transition duration-200 flex flex-col justify-between space-y-3 group cursor-pointer';

                let distanceHtml = '';
                if (item.distanceKm !== undefined) {
                    const walkTimeMin = Math.max(1, Math.round(item.distanceKm * 1000 / 80));
                    distanceHtml = `
                        <div class="flex items-center space-x-1.5 bg-amber-50 text-amber-800 border border-amber-200/80 px-2.5 py-1 rounded-lg text-xs font-semibold w-fit">
                            <i class="fa-solid fa-person-walking text-amber-600"></i>
                            <span>距 ${escapeHtml(item.originName || '參考點')} 約 <strong>${formatDistance(item.distanceKm)}</strong>（步行約 ${walkTimeMin} 分鐘）</span>
                        </div>`;
                }

                const hospitalBadge = item.isNearHospital
                    ? `<span class="bg-indigo-50 text-indigo-700 text-[11px] font-bold px-2 py-0.5 rounded-md border border-indigo-200/60 flex items-center gap-1">
                            <i class="fa-solid fa-hospital-user text-indigo-500"></i>院邊藥房${item.hospitalRef ? '（' + escapeHtml(item.hospitalRef) + '）' : ''}
                       </span>` : '';

                const approxNote = item.approx
                    ? '<div class="text-[10px] text-slate-400 flex items-center gap-1"><i class="fa-solid fa-circle-info"></i>座標為推估位置，出發前請再確認</div>' : '';

                const miniMapOpen = openMiniMapIds.has(String(item.id));

                card.innerHTML = `
                    <div class="space-y-2.5">
                        <div class="flex flex-wrap items-center gap-1.5">
                            <span class="w-6 h-6 rounded-full bg-emerald-600 text-white text-xs font-bold flex items-center justify-center shrink-0">${idx + 1}</span>
                            <span class="bg-emerald-50 text-emerald-700 text-xs font-bold px-2.5 py-0.5 rounded-lg border border-emerald-200/60 flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-emerald-500"></i>${escapeHtml(districtLabel(item.district))}
                            </span>
                            ${hospitalBadge}
                        </div>

                        ${distanceHtml}

                        <h3 class="text-sm font-bold text-slate-800 leading-snug group-hover:text-emerald-700 transition">
                            ${escapeHtml(item.name || '未知藥店')}
                        </h3>

                        <div class="text-xs text-slate-500 space-y-1 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div class="flex items-start space-x-1.5">
                                <i class="fa-solid fa-map-pin text-slate-400 mt-0.5 shrink-0"></i>
                                <span class="break-all">${escapeHtml(item.address || '無詳細地址')}</span>
                            </div>
                            <div class="flex items-center space-x-1.5 pt-1 text-[11px] text-slate-400 font-mono">
                                <i class="fa-solid fa-id-card text-slate-300"></i>
                                <span>機構編碼: ${escapeHtml(item.code || '-')}</span>
                            </div>
                            ${approxNote}
                        </div>

                        <div id="minimap-${escapeHtml(String(item.id))}" class="w-full h-[200px] rounded-xl border border-slate-200 overflow-hidden ${miniMapOpen ? '' : 'hidden'}"></div>
                    </div>

                    <div class="pt-2 border-t border-slate-100 flex items-center gap-2 text-xs">
                        <button data-action="copy" data-id="${escapeHtml(String(item.id))}" class="flex-1 py-2 px-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition font-medium flex items-center justify-center space-x-1">
                            <i class="fa-regular fa-copy"></i><span>複製地址</span>
                        </button>
                        <button data-action="minimap" data-id="${escapeHtml(String(item.id))}" class="flex-1 py-2 px-2 ${miniMapOpen ? 'bg-teal-600 text-white hover:bg-teal-700' : 'bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200/70'} rounded-xl transition font-medium flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-map"></i><span>${miniMapOpen ? '收起地圖' : '地圖'}</span>
                        </button>
                        <a href="${amapNavUrl(item)}" target="_blank" rel="noopener noreferrer" class="flex-1 py-2 px-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition font-medium flex items-center justify-center space-x-1 shadow-sm">
                            <i class="fa-solid fa-route"></i><span>步行導航</span>
                        </a>
                    </div>`;
                cardContainer.appendChild(card);
            });

            // 重建處於展開狀態的迷你地圖
            if (window.L && tileMode) {
                data.forEach(item => {
                    if (openMiniMapIds.has(String(item.id))) buildMiniMap(item, refPoint);
                });
            }
        }

        /* ============================= 渲染：表格 ============================= */
        function renderTable(data) {
            tableBody.innerHTML = '';
            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition text-xs md:text-sm';
                tr.innerHTML = `
                    <td class="py-3 px-3 text-center font-mono text-slate-400">${index + 1}</td>
                    <td class="py-3 px-3 font-medium text-slate-700 whitespace-nowrap">${escapeHtml(districtLabel(item.district))}</td>
                    <td class="py-3 px-3 font-semibold text-slate-800">
                        ${escapeHtml(item.name || '-')}
                        ${item.isNearHospital ? '<span class="ml-1 text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded font-normal whitespace-nowrap">院邊藥房</span>' : ''}
                        <div class="text-[10px] text-slate-400 font-mono font-normal mt-0.5">${escapeHtml(item.code || '-')}</div>
                    </td>
                    <td class="py-3 px-3 text-slate-600 max-w-xs truncate" title="${escapeHtml(item.address || '')}">${escapeHtml(item.address || '-')}</td>
                    <td class="py-3 px-3 text-center whitespace-nowrap">
                        <span class="text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200/60 text-xs font-medium">${item.distanceKm !== undefined ? formatDistance(item.distanceKm) : '-'}</span>
                    </td>
                    <td class="py-3 px-3 text-center whitespace-nowrap">
                        <button data-action="modalmap" data-id="${escapeHtml(String(item.id))}" title="查看地圖" class="text-teal-600 hover:text-teal-800 p-1.5">
                            <i class="fa-solid fa-map-location-dot"></i>
                        </button>
                        <button data-action="copy" data-id="${escapeHtml(String(item.id))}" title="複製地址" class="text-slate-500 hover:text-slate-700 p-1.5">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                        <a href="${amapNavUrl(item)}" target="_blank" rel="noopener noreferrer" title="步行導航" class="text-emerald-600 hover:text-emerald-800 p-1.5 inline-block">
                            <i class="fa-solid fa-route"></i>
                        </a>
                    </td>`;
                tableBody.appendChild(tr);
            });
        }

        /* ============================= GPS 定位 ============================= */
        function findNearestHospital(lat, lng) {
            let nearest = null;
            let minDist = Infinity;
            keyHospitals.forEach(h => {
                const d = calculateDistanceKm(lat, lng, h.lat, h.lng);
                if (d < minDist) {
                    minDist = d;
                    nearest = h;
                }
            });
            return nearest;
        }

        function handleGpsLocation() {
            if (!navigator.geolocation) {
                showToast('您的瀏覽器不支援 GPS 定位服務', 'error');
                return;
            }
            getGpsBtn.disabled = true;
            getGpsBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span class="hidden md:inline">定位中…</span>';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const nearest = findNearestHospital(pos.coords.latitude, pos.coords.longitude);
                    reference = nearest ? { type: 'hospital', hospital: nearest } : null;
                    getGpsBtn.disabled = false;
                    getGpsBtn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i><span class="hidden md:inline">附近藥店</span>';
                    renderHospitalChips();
                    update();
                    showToast(nearest
                        ? `已定位，自動選擇最近醫院：${nearest.name}`
                        : '已完成 GPS 定位');
                },
                (err) => {
                    getGpsBtn.disabled = false;
                    getGpsBtn.innerHTML = '<i class="fa-solid fa-location-crosshairs"></i><span class="hidden md:inline">附近藥店</span>';
                    showToast('定位失敗：' + (err.message || '無法取得定位權限'), 'error');
                },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        /* ============================= 工具函式 ============================= */
        // Haversine 大圓距離 (km)
        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return 9999;
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function deg2rad(deg) { return deg * (Math.PI / 180); }

        function formatDistance(km) {
            const m = Math.round(km * 1000);
            return m >= 1000 ? `${km.toFixed(1)} km` : `${m} m`;
        }

        // 高德步行導航連結（傳入 GCJ-02 座標）
        function amapNavUrl(item) {
            const refPoint = getReferencePoint();
            if (item.lat && item.lng) {
                const to = wgs84ToGcj02(item.lat, item.lng);
                if (refPoint) {
                    const from = wgs84ToGcj02(refPoint.lat, refPoint.lng);
                    return `https://uri.amap.com/navigation?from=${from.lng},${from.lat},${encodeURIComponent(refPoint.name)}&to=${to.lng},${to.lat},${encodeURIComponent(item.name)}&mode=walk&coordinate=gaode&callnative=0`;
                }
                return `https://uri.amap.com/marker?position=${to.lng},${to.lat}&name=${encodeURIComponent(item.name)}&coordinate=gaode&callnative=0`;
            }
            return `https://uri.amap.com/search?keyword=${encodeURIComponent((item.name || '') + ' ' + (item.address || ''))}`;
        }

        function resetAll() {
            searchInput.value = '';
            searchQuery = '';
            selectedDistrict = '';
            reference = null;
            openMiniMapIds.clear();
            toggleClearSearchBtn();
            renderDistrictTags();
            renderHospitalChips();
            update();
            showToast('已重設所有檢索條件');
        }

        /* ============================= CSV 匯入 / 導出 ============================= */
        // 以字串雜湊產生 deterministic 的微小偏移，避免重疊且每次匯入結果一致
        function hashJitter(str, range) {
            let h = 0;
            const s = String(str || '');
            for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return ((h % 1000) / 1000 - 0.5) * range;
        }

        function handleCsvUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function (results) {
                    if (!results.data || results.data.length === 0) return;
                    const parsed = [];
                    results.data.forEach((row, idx) => {
                        const district = row['所属辖区'] || row['轄區'] || '';
                        const code = row['机构编码'] || row['機構編碼'] || '';
                        const name = row['机构名称'] || row['機構名稱'] || '';
                        const address = row['详细地址'] || row['詳細地址'] || '';
                        const id = row['序号'] || (idx + 1).toString();
                        if (!name && !address) return;

                        let lat = parseFloat(row['緯度'] || row['纬度'] || row['lat']);
                        let lng = parseFloat(row['經度'] || row['经度'] || row['lng']);
                        let approx = false;
                        if (!lat || !lng) {
                            // 以轄區中心 + 穩定偏移推估座標（取代隨機座標）
                            const center = districtCenters[district] || [22.5431, 114.0579];
                            lat = center[0] + hashJitter(code + name, 0.03);
                            lng = center[1] + hashJitter(name + address, 0.03);
                            approx = true;
                        }
                        parsed.push({
                            id, district, code, name, address, lat, lng, approx,
                            isNearHospital: name.includes('院边') || name.includes('院邊') || name.includes('医院') || address.includes('医院') || address.includes('醫院')
                        });
                    });

                    if (parsed.length > 0) {
                        rawPharmacies = parsed;
                        selectedDistrict = '';
                        openMiniMapIds.clear();
                        renderDistrictTags();
                        update();
                        const approxCount = parsed.filter(p => p.approx).length;
                        showToast(`成功匯入 ${parsed.length} 筆藥店資料` + (approxCount ? `（其中 ${approxCount} 筆座標為推估位置）` : ''));
                    } else {
                        showToast('CSV 中找不到有效資料列', 'error');
                    }
                },
                error: () => showToast('CSV 解析失敗，請確認檔案格式', 'error')
            });
            e.target.value = '';
        }

        function exportFilteredCsv() {
            if (currentFilteredData.length === 0) {
                showToast('沒有可導出的數據！', 'error');
                return;
            }
            const exportData = currentFilteredData.map(item => ({
                '序号': item.id,
                '所属辖区': item.district,
                '机构编码': item.code,
                '机构名称': item.name,
                '详细地址': item.address,
                '距目标距离(km)': item.distanceKm !== undefined ? item.distanceKm.toFixed(2) : 'N/A',
                '纬度': item.lat || '',
                '经度': item.lng || ''
            }));
            const csvString = Papa.unparse(exportData);
            const blob = new Blob(["\ufeff" + csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `深圳市定點藥店匯出_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`已成功導出 ${currentFilteredData.length} 筆藥店資料`);
        }

        function copyToClipboard(text) {
            if (!text) return;
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text)
                    .then(() => showToast('已複製藥店地址！'))
                    .catch(() => legacyCopy(text));
            } else {
                legacyCopy(text);
            }
        }

        function legacyCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('已複製藥店地址！');
            } catch (err) {
                showToast('複製失敗，請手動選擇複製', 'error');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        /* ============================= Toast ============================= */
        function showToast(msg, type = 'success') {
            const toast = $('toast');
            const toastMsg = $('toastMsg');
            const toastIcon = $('toastIcon');
            toastMsg.textContent = msg;
            toastIcon.className = type === 'error'
                ? 'fa-solid fa-circle-exclamation text-rose-400 text-lg'
                : 'fa-solid fa-circle-check text-emerald-400 text-lg';
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            clearTimeout(showToast._timer);
            showToast._timer = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
