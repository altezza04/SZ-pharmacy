<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳市定點藥店及醫院周邊藥房導航系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">
    <header class="bg-gradient-to-r from-teal-800 via-emerald-700 to-teal-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-lg font-bold">深圳市門診特病定點藥店 & 周邊醫院檢索</h1>
            <div class="flex space-x-2">
                <label for="csvFileInput" class="cursor-pointer bg-white/15 text-white text-xs px-3 py-2 rounded-lg">匯入 CSV</label>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden">
                <button id="exportCsvBtn" class="bg-white/15 text-white text-xs px-3 py-2 rounded-lg">導出結果</button>
                <button id="resetFiltersBtn" class="bg-emerald-950/40 text-white text-xs px-3 py-2 rounded-lg">重設</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-1.5 flex flex-col sm:flex-row gap-1">
            <button id="tabHospitalMode" class="flex-1 py-3 px-4 rounded-xl text-sm font-bold bg-emerald-600 text-white">按附近醫院快速尋找</button>
            <button id="tabSearchMode" class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold text-slate-600">綜合搜尋與轄區篩選</button>
            <button id="tabGpsMode" class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold text-slate-600">我的位置 (GPS 定位)</button>
        </div>

        <section id="hospitalPanel" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
            <h2 class="text-base font-bold text-slate-800">選取深圳市重點醫院，查詢最近的「雙通道」/定點藥房</h2>
            <div id="hospitalChips" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2.5"></div>
        </section>

        <section id="searchPanel" class="hidden bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                <input type="text" id="searchInput" placeholder="搜尋藥店名稱、詳細地址..." class="md:col-span-7 p-2.5 bg-slate-50 border rounded-xl text-sm">
                <select id="districtSelect" class="md:col-span-5 p-2.5 bg-slate-50 border rounded-xl text-sm">
                    <option value="">所有行政轄區 (全部)</option>
                </select>
            </div>
            <div id="districtTags" class="flex flex-wrap gap-1.5 pt-2"></div>
        </section>

        <section id="gpsPanel" class="hidden bg-emerald-50 rounded-2xl border border-emerald-200 p-5 space-y-3">
            <button id="getGpsBtn" class="px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-bold">立即定位</button>
            <div id="gpsStatus" class="hidden text-xs p-2 bg-white rounded-lg"></div>
        </section>

        <section class="bg-white rounded-2xl border p-3.5 flex justify-between items-center">
            <span class="text-xs text-slate-500">找到 <strong id="resultCount" class="text-emerald-700 font-bold text-base">0</strong> 家藥店</span>
            <span id="activeFilterBadge" class="hidden bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full"></span>
            <div class="flex space-x-1 bg-slate-100 p-1 rounded-xl">
                <button id="cardViewBtn" class="px-3 py-1 text-xs bg-white rounded-lg font-bold">卡片</button>
                <button id="tableViewBtn" class="px-3 py-1 text-xs text-slate-500 rounded-lg">表格</button>
            </div>
        </section>

        <section id="cardContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></section>
        <section id="tableContainer" class="hidden bg-white rounded-2xl border overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead><tr class="bg-slate-100 text-xs"><th class="p-3">序號</th><th class="p-3">轄區</th><th class="p-3">名稱</th><th class="p-3">地址</th><th class="p-3">導航</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>
        <div id="noResults" class="hidden p-8 text-center"><button id="clearAllFiltersBtn" class="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs">重設條件</button></div>
    </main>

    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl opacity-0 transition-all z-50">
        <span id="toastMsg" class="text-xs"></span>
    </div>
    <script>
        const keyHospitals = [
            { id: 'h1', name: '北京大學深圳醫院', district: '福田區', lat: 22.5562, lng: 114.0538, desc: '蓮花路1120號' },
            { id: 'h2', name: '深圳市人民醫院 (留醫部)', district: '羅湖區', lat: 22.5574, lng: 114.1293, desc: '翠竹路1017號' },
            { id: 'h3', name: '深圳市第二人民醫院', district: '福田區', lat: 22.5578, lng: 114.0882, desc: '筍崗西路3002號' },
            { id: 'h4', name: '深圳市中醫院', district: '福田區', lat: 22.5367, lng: 114.0841, desc: '福華路1号' },
            { id: 'h5', name: '香港大學深圳醫院', district: '南山區', lat: 22.5284, lng: 113.9912, desc: '海園一路1號' },
            { id: 'h6', name: '深圳市兒童醫院', district: '福田區', lat: 22.5480, lng: 114.0560, desc: '益田路7019號' }
        ];

        const defaultPharmacyData = [
            { id: "1", district: "福田区", code: "P44030700943", name: "深圳市海王星辰健康药房福田宝莲大厦店", address: "深圳市福田区莲花路1116号宝莲大厦1栋01", lat: 22.5558, lng: 114.0535, isNearHospital: true, hospitalRef: "北京大學深圳醫院" },
            { id: "2", district: "福田区", code: "P44030400717", name: "深圳市海王星辰健康药房福华路店", address: "深圳市福田区福华路73号", lat: 22.5365, lng: 114.0845, isNearHospital: true, hospitalRef: "深圳市中醫院" },
            { id: "3", district: "罗湖区", code: "P44030300122", name: "国药控股深圳大药房罗湖店", address: "深圳市罗湖区东门中路1011号", lat: 22.5560, lng: 114.1285, isNearHospital: true, hospitalRef: "深圳市人民醫院" },
            { id: "4", district: "南山区", code: "P44030500812", name: "华润德信行医药深圳南山店", address: "深圳市南山区学苑大道1088号", lat: 22.5935, lng: 113.9710, isNearHospital: true, hospitalRef: "深圳大學總醫院" }
        ];

        let rawPharmacies = [...defaultPharmacyData], currentFilteredData = [], currentMode = 'hospital', selectedHospital = keyHospitals[0], userGps = null, viewMode = 'card';

        document.addEventListener('DOMContentLoaded', () => {
            initHospitalChips(); initDistrictsDropdown(); setupEventListeners(); switchTab('hospital');
        });

        function initHospitalChips() {
            const container = document.getElementById('hospitalChips'); container.innerHTML = '';
            keyHospitals.forEach(hosp => {
                const isSelected = selectedHospital && selectedHospital.id === hosp.id;
                const btn = document.createElement('button');
                btn.className = `p-3 rounded-xl border text-left text-xs ${isSelected ? 'border-emerald-500 bg-emerald-50 font-bold' : 'border-slate-200 bg-slate-50'}`;
                btn.onclick = () => { selectedHospital = hosp; initHospitalChips(); filterAndRenderData(); };
                btn.innerHTML = `<div class="text-emerald-700 font-bold">${hosp.district}</div><div class="font-bold">${hosp.name}</div>`;
                container.appendChild(btn);
            });
        }

        function initDistrictsDropdown() {
            const select = document.getElementById('districtSelect');
            const districts = Array.from(new Set(rawPharmacies.map(p => p.district))).sort();
            districts.forEach(d => { const opt = document.createElement('option'); opt.value = d; opt.textContent = d; select.appendChild(opt); });
        }

        function setupEventListeners() {
            document.getElementById('tabHospitalMode').onclick = () => switchTab('hospital');
            document.getElementById('tabSearchMode').onclick = () => switchTab('search');
            document.getElementById('tabGpsMode').onclick = () => switchTab('gps');
            document.getElementById('searchInput').oninput = filterAndRenderData;
            document.getElementById('districtSelect').onchange = filterAndRenderData;
            document.getElementById('cardViewBtn').onclick = () => setViewMode('card');
            document.getElementById('tableViewBtn').onclick = () => setViewMode('table');
            document.getElementById('getGpsBtn').onclick = handleGpsLocation;
        }

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('hospitalPanel').classList.toggle('hidden', mode !== 'hospital');
            document.getElementById('searchPanel').classList.toggle('hidden', mode !== 'search');
            document.getElementById('gpsPanel').classList.toggle('hidden', mode !== 'gps');
            filterAndRenderData();
        }

        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('cardContainer').classList.toggle('hidden', mode !== 'card');
            document.getElementById('tableContainer').classList.toggle('hidden', mode !== 'table');
        }

        function filterAndRenderData() {
            let data = [...rawPharmacies];
            if (currentMode === 'hospital' && selectedHospital) {
                data = data.map(p => ({ ...p, distanceKm: calculateDistanceKm(selectedHospital.lat, selectedHospital.lng, p.lat, p.lng) })).sort((a,b) => a.distanceKm - b.distanceKm);
            }
            currentFilteredData = data;
            document.getElementById('resultCount').textContent = data.length;
            renderCards(data);
        }

        function renderCards(data) {
            const container = document.getElementById('cardContainer'); container.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 border space-y-2';
                card.innerHTML = `
                    <div class="text-xs text-emerald-700 font-bold">${item.district}</div>
                    <h3 class="font-bold text-slate-800">${item.name}</h3>
                    <p class="text-xs text-slate-500">${item.address}</p>
                    <div class="flex gap-2 text-xs pt-2">
                        <button onclick="copyToClipboard('${item.address}')" class="flex-1 py-1.5 bg-slate-100 rounded-lg">複製地址</button>
                        <a href="https://uri.amap.com/search?keyword=${encodeURIComponent(item.name)}" target="_blank" class="flex-1 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-center">導航</a>
                    </div>`;
                container.appendChild(card);
            });
        }

        function handleGpsLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                userGps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                filterAndRenderData();
            });
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        async function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                alert('已複製藥店地址！');
            }
        }
    </script>
</body>
</html>
